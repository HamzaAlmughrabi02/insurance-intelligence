const nav=[['home','⌂','الرئيسية'],['cases','▤','المعاملات'],['results','◫','النتائج'],['review','◇','المراجعة'],['audit','◷','السجل']];let page='home',files=[],token='',connected=false,busy=false,currentId='',poller=null;let cases=[{id:'DEMO-1042',kind:'مطالبة مركبة',client:'عميل تجريبي',status:'review',created_at:'2026-11-22',result:JSON.stringify({summary:'نموذج توضيحي لعرض ملخص التحليل. يجب مراجعة المستند والمصادر قبل أي قرار.',extracted:{'نوع المستند':'مطالبة تأمين','رقم الوثيقة':'DEMO-4821','تاريخ المستند':'2026-11-20'},flags:['بيان يحتاج تأكيد المشرف']})},{id:'DEMO-1041',kind:'وثيقة تأمين',client:'حالة تجريبية',status:'approved',created_at:'2026-11-21'},{id:'DEMO-1040',kind:'مطالبة صحية',client:'حالة تجريبية',status:'processing',created_at:'2026-11-21'}];let logs=[];const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');setTimeout(()=>$('toast').classList.add('hidden'),3500)}function badge(s){let names={draft:'مسودة',queued:'في الانتظار',processing:'قيد التحليل',review:'تحتاج مراجعة',approved:'معتمدة',rejected:'مرفوضة'};return `<span class="pill ${esc(s)}">${names[s]||esc(s)}</span>`}function go(p){page=p;render();window.scrollTo({top:0,behavior:'smooth'})}function render(){let titles={home:['مساحة تحليل الوثائق','ارفع وثيقتك واطلع على نتائج التحليل خطوة بخطوة.'],cases:['إدارة المعاملات','جميع الطلبات وحالات المعالجة.'],results:['نتائج التحليل','تفاصيل التحليل والمعلومات المستخرجة وملاحظات المراجعة.'],review:['مركز المراجعة','تحقق بشري قبل اتخاذ أي قرار.'],audit:['سجل النشاط','متابعة الأحداث والتعديلات.'],settings:['إعدادات الاتصال','ربط الواجهة بالخادم المحلي.']};$('title').textContent=titles[page][0];$('subtitle').textContent=titles[page][1];$('nav').innerHTML=nav.map(([id,ic,label])=>`<button class="navbtn ${page===id?'active':''}" onclick="go('${id}')" aria-label="${label}">${ic}<span>${label}</span></button>`).join('');$('connection').innerHTML=`<i class="dot ${connected?'online':''}"></i> ${connected?'متصل بالخادم':'وضع العرض'}`;$('content').innerHTML=({home,casePage,resultPage,reviewPage,auditPage,settingsPage}[{home:'home',cases:'casePage',results:'resultPage',review:'reviewPage',audit:'auditPage',settings:'settingsPage'}[page]]||home)();if(page==='results'&&connected&&currentId)loadDetail(currentId);if(page==='audit'&&connected)loadAudit()}
function home(){return `<div class="dashboard"><div style="display:grid;gap:18px"><section class="card hero"><div class="eyebrow" style="color:#eef4ff;margin-bottom:18px">SMART DOCUMENT ANALYSIS</div><h2>من الوثيقة إلى رؤية واضحة.</h2><p>أرفق مستند التأمين، وراقب مراحل المعالجة، ثم راجع النتائج والأدلة قبل الاعتماد.</p><button class="primary" onclick="loadDemoSample()">استخدم ملفات المثال</button></section><section class="card"><div class="card-head"><h2>إرفاق وثيقة جديدة</h2><span class="muted">PDF · JPG · PNG · XLSX</span></div><div class="upload-zone" id="drop" onclick="loadDemoSample()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="dropFiles(event)"><div class="upload-icon">⇧</div><strong>${files.length?files.length+' ملف محدد':'اسحب الوثائق هنا أو انقر للاختيار'}</strong><span class="muted">${files.length?files.map(f=>esc(f.name)).join(' · '):'الحد الأقصى لكل ملف 10 MB في الخادم الحالي'}</span></div><div class="toolbar" style="margin-top:12px;flex-wrap:wrap"><button class="ghost" onclick="loadDemoSample()">ملفات المثال الجاهزة</button><button class="ghost" onclick="loadDemoSample()">استعراض حزمة المثال</button><span class="muted">كل مجلد فرعي مباشر = معاملة مستقلة؛ اختيار مجلد واحد يحتوي ملفات مباشرة = معاملة واحدة</span></div><div class="formrow"><label class="field">نوع المعاملة<select id="kind"><option>وثيقة تأمين</option><option>مطالبة تأمين مركبة</option><option>مطالبة تأمين صحي</option><option>طلب مراجعة مستندات</option></select></label><label class="field">مرجع العميل<input id="client" placeholder="مثال: C-001"></label><label class="field wide">ملاحظات إضافية<textarea id="notes" rows="2" placeholder="اختياري"></textarea></label></div><div class="toolbar"><span class="muted">${connected?'تجربة داخل المتصفح؛ لا تُرفع الملفات إلى خادم':'وضع العرض: لن يتم رفع أي ملف'}</span><button class="primary" id="submit" onclick="submit()" ${busy?'disabled':''}>✦ بدء التحليل</button></div></section></d function analysisStatus(){let c=cases.find(x=>x.id===currentId)||cases.find(x=>['processing','queued'].includes(x.status));if(!c)return `<div class="empty">لا يوجد تحليل جارٍ الآن.<p class="muted">عند إرسال مستند ستظهر مراحل المعالجة هنا.</p></div>`;let done=['review','approved','rejected'].includes(c.status),active=['processing','queued'].includes(c.status);return `<div class="muted">${esc(c.id)} ${badge(c.status)}</div><div class="steps">${[['✓','استلام الوثيقة'],['⌁','إرسال إلى n8n'],['◈','انتظار نتيجة التحليل'],['◇','المراجعة البشرية']].map(([ic,n],i)=>`<div class="step ${i===0?'done':i===1&&active?'done':i===2&&active?'active':i===3&&done?'done':''}"><span class="stepicon">${ic}</span><span class="spinner"></span><span>${n}</span></div>`).join('')}</div><div class="progress"><div style="width:${done?100:active?65:12}%"></div></div><p class="muted">${active?'بانتظار استجابة النظام الفعلية، وليست نسبة إنجاز محسوبة.':done?'وصلت النتيجة؛ راجعها قبل الاعتماد.':'المعاملة لم تبدأ المعالجة بعد.'}</p><button class="ghost" onclick="openResult('${esc(c.id)}')">تفاصيل المعاملة</button>`}

async function api(path,method='GET',body=null,headers={}){let h={Authorization:'Bearer '+token,...headers};let data=body;if(body&&!(body instanceof Blob)){h['Content-Type']='application/json';data=JSON.stringify(body)}let res=await fetch('/api'+path,{method,headers:h,body:data});let j=await res.json();if(!res.ok)throw Error(j.error||'HTTP '+res.status);return j}async function connect(){let t=$('token').value.trim();if(!t)return toast('أدخل الرمز أولًا');token=t;try{await refresh();connected=true;toast('تم الاتصال بالخادم');render()}catch(e){token='';toast('فشل الاتصال: '+e.message)}}function disconnect(){token='';connected=false;cases=cases.filter(x=>x.id.startsWith('DEMO-'));render()}async function refresh(){let arr=await api('/cases');cases=arr;return arr}async function loadDetail(id){try{let c=await api('/cases/'+encodeURIComponent(id));if(currentId!==id||page!=='results')return;let el=$('detail');if(el)el.innerHTML=renderDetail(c);let docs=$('docs');if(docs)docs.innerHTML=c.documents?.length?c.documents.map(d=>`<div class="kv"><span>📄</span><strong>${esc(d.original_name)}</strong></div>`).join(''):'<div class="empty">لا توجد مستندات مسجلة</div>'}catch(e){toast(e.message)}}async function loadAudit(){try{logs=await api('/audit');if(page==='audit')$('auditRows').innerHTML=tableLogs()}catch(e){toast(e.message)}}async function decide(id,decision){let note=$('note-'+id)?.value.trim();if(!note)return toast('اكتب سبب القرار');if(!confirm('تأكيد القرار بعد مراجعة المستندات؟'))return;try{await api('/cases/'+encodeURIComponent(id)+'/review','POST',{decision,note},{'X-Role':'supervisor'});await refresh();render();toast('تم تسجيل القرار')}catch(e){toast(e.message)}}function dropFiles(e){e.preventDefault();e.stopPropagation();files=Array.from(e.dataTransfer.files);render()}$('fileinput').addEventListener('change',e=>{files=Array.from(e.target.files);render()});$('folderinput').addEventListener('change',e=>{files=Array.from(e.target.files).filter(f=>/\.(pdf|png|jpe?g|xlsx)$/i.test(f.name));render();toast('تم اختيار '+files.length+' مستند من المجلد')});async function submit(){let kind=$('kind').value,client=$('client').value.trim(),notes=$('notes').value;if(!client||!files.length)return toast('أدخل مرجع العميل واختر مستندًا');if(!connected)return toast('اتصل بالخادم من الإعدادات أولًا');if(files.some(f=>f.size>10*1024*1024))return toast('ملف أكبر من 10 MB');let groups=new Map();for(let f of files){let path=f.webkitRelativePath||'',parts=path.split('/').filter(Boolean);let group=parts.length>2?parts[1]:'معاملة واحدة';if(!groups.has(group))groups.set(group,[]);groups.get(group).push(f)}if(groups.size>1&&!confirm('سيتم إنشاء '+groups.size+' معاملات منفصلة. هل تريد المتابعة؟'))return;busy=true;$('submit').disabled=true;$('submit').textContent='جاري إرسال الملفات...';let success=0,errors=[];try{for(let [group,docs] of groups){try{let c=await api('/cases','POST',{kind,client,notes:notes+(groups.size>1?' | مجلد: '+group:'')});currentId=c.id;for(let f of docs)await api('/cases/'+encodeURIComponent(c.id)+'/documents','POST',f,{'X-Filename':f.name});let r=await api('/cases/'+encodeURIComponent(c.id)+'/submit','POST',{});success++;if(r.warning)errors.push(group+': '+r.warning)}catch(e){errors.push(group+': '+e.message)}}files=[];await refresh();go('cases');toast('تم إنشاء '+success+' معاملات. '+(errors.length?'تنبيهات: '+errors.join('؛ '):''));startPolling()}finally{busy=false;if(page==='home')render()}}function startPolling(){clearInterval(poller);let count=0;poller=setInterval(async()=>{if(!connected||count++>120){clearInterval(poller);return}try{await refresh();if(page==='home')$('analysisStatus').innerHTML=analysisStatus();let c=cases.find(x=>x.id===currentId);if(c&&!['queued','processing'].includes(c.status)){clearInterval(poller);toast('وصل تحديث جديد للمعاملة');render()}}catch{}},5000)}document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){let d=document.createElement(  if(/POLICY_STATUS_REQUIRES_REVIEW|not confirmed as ACTIVE/i.test(text))return {key:'policy-status',title:'حالة الوثيقة تحتاج تأكيدًا',detail:'لم يؤكد التحقق أن حالة الوثيقة فعّالة. راجع الحالة من مصدرها المعتمد.',field:'policy_number'};
 if(/CONFLICTING_POLICY_NUMBERS/.test(text))return {key:'policy-conflict',title:'رقم الوثيقة لا يتطابق بين البيانات والمستندات',detail:'قارن رقم الوثيقة المدخل مع الأرقام الظاهرة في المصادر؛ لم تُعدّل البيانات تلقائيًا.',pattern:/POL-[A-Z0-9-]+/i,field:'policy_number'};
 if(/NO_READABLE_TEXT|UNREADABLE_DOCUMENT|IMAGE_OCR_NOT_AVAILABLE/.test(text))return {key:text,title:'تعذر استخراج نص قابل للمراجعة',detail:'اعرض الأصل للتدقيق اليدوي. الصور أو ملفات PDF الممسوحة قد تحتاج OCR غير متوفر حاليًا.'};
 if(/DATE_OUTSIDE_POLICY_PERIOD|outside the recorded policy period/i.test(text))return {key:'date',title:'تاريخ الحادث خارج فترة الوثيقة المسجلة',detail:'راجع تاريخ الحادث وفترة الوثيقة. هذه نتيجة مقارنة أولية وليست قرار تغطية.',field:'accident_date'};
 if(/claim_data\./.test(text)){const field=text.split('claim_data.')[1]?.split(/\s/)[0];return {key:text,title:'بيان مطلوب يحتاج استكمالًا',detail:fieldLabels[field]||text,field}}
 return {key:text,title:'ملاحظة تحتاج مراجعتك',detail:text};
}
function collectFindings(result){
 const seen=new Set();return [...(result.flags||[]),...(result.findings||[])].map(findingInfo).filter(f=>{if(seen.has(f.key))return false;seen.add(f.key);return true});
}
function relatedSources(finding,evidence){
 if(!finding.pattern)return [];
 const matches=[];
 for(const doc of evidence)for(const page of doc.pages||[]){
  const lines=String(page.text||'').split('\n');const indices=lines.map((line,index)=>finding.pattern.test(line)?index:-1).filter(i=>i>=0);
  if(indices.length){const selected=new Set();for(const i of indices)for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+1);j++)selected.add(j);
   matches.push({document_id:doc.document_id,page:page.page,text:[...selected].sort((a,b)=>a-b).map(i=>lines[i]).join('\n')});}
 }return matches;
}
resultPage=function(){
 const c=cases.find(c=>c.id===currentId)||cases[0];if(!c)return '<section class="card"><div class="empty">اختر معاملة لعرض نتيجتها.</div></section>';
 currentId=c.id;
 return `<div class="toolbar"><span>${esc(c.id)} · ${esc(c.client)}</span>${badge(c.status)}</div><div class="review-workspace"><section class="card"><h2>نتيجة التحليل</h2><div id="detail" aria-live="polite"><p class="muted">جارٍ تحميل النتيجة…</p></div></section><section class="card" id="evidence-panel"><h2>المستندات والأدلة</h2><p class="muted">اختر اسم الملف لعرضه، أو انتقل إلى نصه المستخرج.</p><div id="docs" aria-live="polite"><p class="muted">جارٍ تحميل المستندات…</p></div></section></div>`;
};
renderDetail=function(c){
 const result=reviewResult(c);if(!c.result)return previousDetailRenderer(c);
 const fields=result.extracted||{};const findings=collectFindings(result);
 const local=result.analysis_type==='LOCAL_RULES_AND_DOCUMENT_EVIDENCE';
 let html=`<p class="review-summary">${esc(local?'اكتملت الفحوص الأولية. راجع البيانات المستخرجة والملاحظات المرتبطة بمصادرها قبل استكمال المراجعة.':result.summary||'وصلت نتيجة أولية تحتاج مراجعتك.')}</p><h2>البيانات المستخرجة</h2>${Object.entries(fields).map(([key,value])=>`<div class="review-kv" id="review-field-${esc(key)}"><span>${esc(fieldLabels[key]||key)}</span><strong dir="auto">${esc(key==='claim_type'&&value==='motor'?'مطالبة مركبة':typeof value==='object'?JSON.stringify(value):value)}</strong></div>`).join('')}<section class="review-findings"><h2>ملاحظات تحتاج تحققًا <small class="muted">${findings.length}</small></h2>${findings.map((f,i)=>`<button type="button" class="finding-button" onclick="showReviewFinding(${i})" aria-controls="finding-detail"><span class="finding-index">${i+1}</span><span class="finding-body"><strong>${esc(f.title)}</strong><small>${esc(f.detail)}</small></span><span class="finding-arrow" aria-hidden="true">←</span></button>`).join('')||'<p class="muted">لم ترد ملاحظات منفصلة. تبقى المراجعة البشرية مطلوبة.</p>'}<div id="finding-detail" tabindex="-1"></div></section>`;
 const old=previousDetailRenderer(c);const correction=old.indexOf('<details style="margin-top:24px">');if(correction>=0)html+=old.slice(correction);
 return html;
};
loadDetail=async function(id){
 const request=++reviewLoad;
 try{
  const [c,evidence,history]=await Promise.all([api('/cases/'+encodeURIComponent(id)),api('/cases/'+encodeURIComponent(id)+'/evidence'),api('/cases/'+encodeURIComponent(id)+'/history')]);
  if(request!==reviewLoad||currentId!==id||page!=='results')return;
  const old=evidenceReview;const result=reviewResult(c);
  evidenceReview={case_id:id,case:c,documents:c.documents||[],evidence,history,findings:collectFindings(result),selected:old?.case_id===id?old.selected:0,mode:old?.case_id===id?old.mode:'original',page:old?.case_id===id?old.page:0};
  $('detail').innerHTML=renderDetail(c);renderEvidenceWorkspace();
 }catch(e){if(request===reviewLoad&&page==='results'){$('docs').innerHTML=`<p class="notice">${esc(e.message)}</p>`;toast(e.message)}}
};
function renderEvidenceWorkspace(){
 const s=evidenceReview;if(!s||!$('docs'))return;
 if(!s.documents.length){$('docs').innerHTML='<div class="empty">لا توجد مستندات لهذه المعاملة.</div>';return}
 s.selected=Math.max(0,Math.min(s.selected,s.documents.length-1));
 $('docs').innerHTML=`<div class="evidence-list">${s.documents.map((d,i)=>`<button type="button" class="document-link" aria-pressed="${i===s.selected}" onclick="selectEvidence(${i},'original')"><span dir="auto">${esc(d.original_name)}</span><small>${esc((d.original_name.split('.').pop()||'').toUpperCase())} ↗</small></button>`).join('')}</div><div class="evidence-toolbar"><div class="evidence-tabs" aria-label="طريقة عرض الدليل"><button type="button" aria-pressed="${s.mode==='original'}" onclick="selectEvidence(${s.selected},'original')">المستند الأصلي</button><button type="button" aria-pressed="${s.mode==='text'}" onclick="selectEvidence(${s.selected},'text')">النص المستخرج</button></div><select id="evidence-page" class="evidence-page-select" aria-label="صفحة المصدر" onchange="changeEvidencePage(this.value)"></select></div><div id="evidence-reader"></div><details class="review-history"><summary>سجل إصدارات التحليل (${s.history.length})</summary>${s.history.map(h=>`<p>الإصدار ${esc(h.version)} · ${esc(h.created_at)}</p>`).join('')}</details>`;
 renderEvidenceReader();
}
function selectEvidence(index,mode,pageIndex=0){if(!evidenceReview)return;evidenceReview.selected=index;evidenceReview.mode=mode;evidenceReview.page=pageIndex;renderEvidenceWorkspace()}
function changeEvidencePage(value){evidenceReview.page=Number(value);renderEvidenceReader()}
function renderEvidenceReader(){
 const s=evidenceReview,d=s.documents[s.selected],e=s.evidence.find(e=>e.document_id===d.id),pages=e?.pages||[];
 s.page=Math.max(0,Math.min(s.page,Math.max(0,pages.length-1)));const p=pages[s.page];const selector=$('evidence-page');
 selector.innerHTML=pages.map((p,i)=>`<option value="${i}" ${i===s.page?'selected':''}>الصفحة ${esc(p.page)}</option>`).join('');selector.disabled=!pages.length;
 const url=demoDocumentUrl(d);const ext=d.original_name.split('.').pop().toLowerCase();
 let body;
 if(s.mode==='text')body=p?.text?.trim()?`<pre class="source-text" dir="auto">${esc(p.text)}</pre>`:'<p class="reader-message">لا يتوفر نص مستخرج لهذه الصفحة. يمكنك مراجعة المستند الأصلي.</p>';
 else if(ext==='pdf')body=`<iframe title="${esc('معاينة '+d.original_name)}" src="${url}#page=${Number(p?.page)||1}"></iframe>`;
 else if(['png','jpg','jpeg'].includes(ext))body=`<img src="${url}" alt="${esc(d.original_name)}">`;
 else body='<p class="reader-message">هذا النوع لا يملك عارضًا أصليًا داخل المتصفح. افتح «النص المستخرج» لمراجعته.</p>';
 $('evidence-reader').innerHTML=`<div class="reader-caption"><strong dir="auto">${esc(d.original_name)}</strong>${['pdf','png','jpg','jpeg'].includes(ext)?`<a href="${url}" target="_blank" rel="noopener noreferrer">فتح الأصل في تبويب مستقل ↗</a>`:''}</div><div class="evidence-reader">${body}</div>`;
}
function showReviewFinding(index){
 const s=evidenceReview;if(!s)return;const finding=s.findings[index];if(!finding)return;
 const matches=relatedSources(finding,s.evidence);
 $('finding-detail').innerHTML=`<section class="finding-detail"><h3>${esc(finding.title)}</h3><p>${esc(finding.detail)}</p>${matches.length?'<p class="muted">مواضع مرتبطة بالتنبيه وفق بحث نصي؛ تحقق من السياق في الأصل.</p>':`<p>${finding.field?'هذا التنبيه متعلق ببيانات النظام والتحقق، وليس اقتباسًا من مستند.':'لا يتوفر موضع نصي محدد لهذا التنبيه. راجع الأصول دون افتراض مصدر غير مسجل.'}</p>`}${matches.map((m,i)=>{const d=s.documents.find(d=>d.id===m.document_id);return `<div class="source-match"><button type="button" class="source-action" onclick="openFindingSource(${index},${i})">${esc(d?.original_name||'مستند')} · الصفحة ${esc(m.page)} ← عرض النص</button><blockquote dir="auto">${esc(m.text)}</blockquote></div>`}).join('')}</section>`;
 $('finding-detail').focus({preventScroll:true});$('finding-detail').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});
}
function openFindingSource(findingIndex,matchIndex){
 const s=evidenceReview,m=relatedSources(s.findings[findingIndex],s.evidence)[matchIndex];if(!m)return;
 const index=s.documents.findIndex(d=>d.id===m.document_id);if(index<0)return;
 const e=s.evidence.find(e=>e.document_id===m.document_id);const p=e.pages.findIndex(p=>String(p.page)===String(m.page));selectEvidence(index,'text',Math.max(0,p));
 $('evidence-panel').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'});
}

</script><script src="review-center.js"></script><script src="demo-data.js"></script><script src="demo.js"></script></body></html>

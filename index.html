function home(){return `<div class="dashboard"><div style="display:grid;gap:18px"><section class="card hero"><div class="eyebrow" style="color:#eef4ff;margin-bottom:18px">SMART DOCUMENT ANALYSIS</div><h2>من الوثيقة إلى رؤية واضحة.</h2><p>أرفق مستند التأمين، وراقب مراحل المعالجة، ثم راجع النتائج والأدلة قبل الاعتماد.</p><button class="primary" onclick="$('fileinput').click()">＋ اختر مستندات</button></section><section class="card"><div class="card-head"><h2>إرفاق وثيقة جديدة</h2><span class="muted">PDF · JPG · PNG · XLSX</span></div><div class="upload-zone" id="drop" onclick="$('fileinput').click()" ondragover="event.preventDefault();this.classList.add('drag')" ondragleave="this.classList.remove('drag')" ondrop="dropFiles(event)"><div class="upload-icon">⇧</div><strong>${files.length?files.length+' ملف محدد':'اسحب الوثائق هنا أو انقر للاختيار'}</strong><span class="muted">${files.length?files.map(f=>esc(f.name)).join(' · '):'الحد الأقصى لكل ملف 10 MB في الخادم الحالي'}</span></div><div class="toolbar" style="margin-top:12px;flex-wrap:wrap"><button class="ghost" onclick="$('fileinput').click()">＋ ملفات معاملة واحدة</button><button class="ghost" onclick="$('folderinput').click()">▣ مجلد معاملات</button><span class="muted">كل مجلد فرعي مباشر = معاملة مستقلة؛ اختيار مجلد واحد يحتوي ملفات مباشرة = معاملة واحدة</span></div><div class="formrow"><label class="field">نوع المعاملة<select id="kind"><option disabled>وثيقة تأمين — مراجعة يدوية</option><option selected>مطالبة تأمين مركبة</option><option disabled>مطالبة تأمين صحي — غير مدعوم آليًا</option><option disabled>طلب مراجعة مستندات — مراجعة يدوية</option></select></label><label class="field">مرجع العميل<input id="client" placeholder="مثال: C-001"></label><label class="field wide">ملاحظات إضافية<textarea id="notes" rows="2" placeholder="اختياري"></textarea></label></div><div class="toolbar"><span class="muted">${connected?'سيتم إرسال الملفات إلى الخادم المحلي':'وضع العرض: لن يتم رفع أي ملف'}</span><button class="primary" id="submit" onclick="submit()" ${busy?'disabled':''}>✦ بدء التحليل</button></div></section></div><div style="display:grid;gap:18px;align-content:start"><section class="card"><div class="card-head"><h2>ملخص العمليات</h2><span class="muted">${connected?'بيانات الخادم':'بيانات توضيحية'}</span></div><div class="stat-grid">${[['المعاملات',cases.length,'▤'],['المراجعة',cases.filter(c=>c.status==='review').length,'◇'],['المكتملة',cases.filter(c=>c.status==='approved').length,'✓']].map(([n,v,i])=>`<div class="stat"><span class="muted">${n}</span><span class="mini">${i}</span><strong>${v}</strong><small>حالة</small></div>`).join('')}</div></section><section class="card"><div class="card-head"><h2>حالة التحليل</h2><span class="muted">Live Status</span></div><div id="analysisStatus">${analysisStatus()}</div></section><section class="card"><div class="card-head"><h2>آخر معاملة</h2><button class="ghost" onclick="go('cases')">عرض الكل</button></div>${cases.length?`<strong>${esc(cases[0].id)}</strong><p class="muted">${esc(cases[0].kind)} · ${esc(cases[0].client)}</p>${badge(cases[0].status)}<div style="margin-top:16px"><button class="ghost" onclick="openResult('${esc(cases[0].id)}')">عرض التفاصيل ←</button></div>`:'<div class="empty">لا توجد معاملات بعد</div>'}</section></div></div><section class="card" style="margin-top:18px"><div class="card-head"><h2>المعاملات الأخيرة</h2><button class="ghost" onclick="go('cases')">كل المعاملات</button></div>${table(cases.slice(0,5))}</section>`}
function analysisStatus(){let c=cases.find(x=>x.id===currentId)||cases.find(x=>['processing','queued'].includes(x.status));if(!c)return `<div class="empty">لا يوجد تحليل جارٍ الآن.<p class="muted">عند إرسال مستند ستظهر مراحل المعالجة هنا.</p></div>`;let done=['review','approved','rejected'].includes(c.status),active=['processing','queued'].includes(c.status);return `<div class="muted">${esc(c.id)} ${badge(c.status)}</div><div class="steps">${[['✓','استلام الوثيقة'],['⌁','إرسال إلى n8n'],['◈','انتظار نتيجة التحليل'],['◇','المراجعة البشرية']].map(([ic,n],i)=>`<div class="step ${i===0?'done':i===1&&active?'done':i===2&&active?'active':i===3&&done?'done':''}"><span class="stepicon">${ic}</span><span class="spinner"></span><span>${n}</span></div>`).join('')}</div><div class="progress"><div style="width:${done?100:active?65:12}%"></div></div><p class="muted">${active?'بانتظار استجابة النظام الفعلية، وليست نسبة إنجاز محسوبة.':done?'وصلت النتيجة؛ راجعها قبل الاعتماد.':'المعاملة لم تبدأ المعالجة بعد.'}</p><button class="ghost" onclick="openResult('${esc(c.id)}')">تفاصيل المعاملة</button>`}

function resultPage(){let c=cases.find(x=>x.id===currentId)||cases[0];if(!c)return '<div class="card empty">لا توجد نتائج</div>';currentId=c.id;return `<div class="toolbar"><select id="pick" onchange="openResult(this.value)" style="padding:12px;border-radius:14px;border:1px solid #ddd">${cases.map(x=>`<option value="${esc(x.id)}" ${x.id===c.id?'selected':''}>${esc(x.id)} · ${esc(x.kind)}</option>`).join('')}</select>${badge(c.status)}</div><div class="two"><section class="card"><h2>نتيجة التحليل</h2><p class="muted">${esc(c.id)} · ${esc(c.client)}</p><div id="detail">${renderDetail(c)}</div></section><section class="card"><h2>المستندات والأدلة</h2><div id="docs" class="resultbox"><div class="empty">${connected?'جارٍ تحميل قائمة المستندات...':'معاينة المستندات غير متاحة في وضع العرض'}</div></div><div class="notice" style="margin-top:18px">النتائج مساعدة للمراجع وليست قرارًا آليًا بشأن قبول المطالبة أو رفضها.</div></section></div>`}function renderDetail(c){let r;try{r=typeof c.result==='string'?JSON.parse(c.result):c.result}catch{r=null}if(!r)return `<div class="empty">${['processing','queued'].includes(c.status)?'<div class="spinner" style="margin:auto"></div><p>جاري انتظار نتيجة التحليل من n8n...</p>':'لم تصل نتيجة تحليل بعد.'}</div>`;let summary=r.summary||r.overview||r.analysis||r.message;let extracted=r.extracted||r.fields||r.extracted_data||{};let flags=r.flags||r.warnings||r.uncertainties||[];return `<div class="resultbox"><strong>ملخص التحليل</strong><p>${esc(typeof summary==='string'?summary:'لم يقدم النظام ملخصًا نصيًا واضحًا.')}</p></div><h2 style="margin-top:22px">البيانات المستخرجة</h2>${Object.keys(extracted).length?Object.entries(extracted).map(([k,v])=>`<div class="kv"><span>${esc(k)}</span><strong>${esc(typeof v==='object'?JSON.stringify(v):v)}</strong></div>`).join(''):'<p class="muted">لم تتوفر حقول منظمة. يمكنك مراجعة البيانات الخام أدناه.</p>'}<h2 style="margin-top:22px">ملاحظات وتحقق</h2>${flags.length?flags.map(f=>`<div class="notice" style="margin:8px 0">⚠ ${esc(typeof f==='object'?JSON.stringify(f):f)}</div>`).join(''):'<p class="muted">لم يرسل النظام قائمة ملاحظات منفصلة.</p>'}<details style="margin-top:20px"><summary>عرض نتيجة JSON الكاملة</summary><pre style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px">${esc(JSON.stringify(r,null,2))}</pre></details>`}function reviewPage(){let arr=cases.filter(c=>c.status==='review');return `<section class="card"><h2>المعاملات بانتظار المراجعة</h2><div class="notice">لا تعتمد النتائج إلا بعد مقارنة المعلومات مع المستند الأصلي والتحقق من صلاحيات المراجع.</div>${arr.map(c=>`<div class="resultbox" style="margin-top:14px"><div class="toolbar"><b>${esc(c.id)} · ${esc(c.kind)}</b>${badge(c.status)}</div><button class="ghost" onclick="openResult('${esc(c.id)}')">مراجعة النتيجة</button>${connected?`<label class="field" style="margin:15px 0">سبب القرار<textarea id="note-${esc(c.id)}" rows="2" placeholder="سبب مكتوب إلزامي"></textarea></label><button class="primary" onclick="decide('${esc(c.id)}','approve')">اعتماد</button> <button class="ghost" onclick="decide('${esc(c.id)}','reject')">رفض</button>`:'<p class="muted">الاعتماد غير متاح في وضع العرض</p>'}</div>`).join('')||'<div class="empty">لا توجد معاملات معلقة</div>'}</section>`}function auditPage(){return `<section class="card"><h2>سجل الأحداث</h2><div id="auditRows">${logs.length?tableLogs():`<div class="empty">${connected?'جارٍ التحميل...':'السجل الفعلي متاح بعد الاتصال بالخادم'}</div>`}</div></section>`}function tableLogs(){return `<div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>الإجراء</th><th>المستخدم</th></tr></thead><tbody>${logs.map(x=>`<tr><td>${esc(x.created_at)}</td><td>${esc(x.action)}</td><td>${esc(x.actor)}</td></tr>`).join('')}</tbody></table></div>`}function settingsPage(){return `<div class="two"><section class="card"><h2>الاتصال المحلي</h2><p class="muted">أدخل رمز API الذي استخدمته عند تشغيل الخادم. يبقى في ذاكرة الصفحة فقط.</p><label class="field">API Token<input id="token" type="password" autocomplete="off" placeholder="الرمز المحلي"></label><div style="margin-top:18px"><button class="primary" onclick="connect()">اتصال وتحديث البيانات</button> <button class="ghost" onclick="disconnect()">قطع الاتصال</button></div><p class="muted">${connected?'الخادم متصل':'وضع العرض فقط'}</p></section><section class="card"><h2>معلومات النظام</h2><div class="kv"><span>Backend</span><b>Python · Local API</b></div><div class="kv"><span>n8n</span><b>حسب إعدادات الخادم</b></div><div class="kv"><span>النتائج</span><b>تتطلب مراجعة بشرية</b></div><div class="notice">توصية: لا تستخدم بيانات تأمين حقيقية قبل إكمال المصادقة والتشفير والاختبارات الأمنية.</div></section></div>`}
async function api(path,method='GET',body=null,headers={}){let h={Authorization:'Bearer '+token,...headers};let data=body;if(body&&!(body instanceof Blob)){h['Content-Type']='application/json';data=JSON.stringify(body)}let res=await fetch('/api'+path,{method,headers:h,body:data});let j=await res.json();if(!res.ok)throw Error(j.error||'HTTP '+res.status);return j}async function connect(){let t=$('token').value.trim();if(!t)return toast('أدخل الرمز أولًا');token=t;try{await refresh();connected=true;toast('تم الاتصال بالخادم');render()}catch(e){token='';toast('فشل الاتصال: '+e.message)}}function disconnect(){token='';connected=false;cases=cases.filter(x=>x.id.startsWith('DEMO-'));render()}async function refresh(){let arr=await api('/cases');cases=arr;return arr}async function loadDetail(id){try{let c=await api('/cases/'+encodeURIComponent(id));if(currentId!==id||page!=='results')return;let el=$('detail');if(el)el.innerHTML=renderDetail(c);let docs=$('docs');if(docs)docs.innerHTML=c.documents?.length?c.documents.map(d=>`<div class="kv"><span>📄</span><strong>${esc(d.original_name)}</strong></div>`).join(''):'<div class="empty">لا توجد مستندات مسجلة</div>'}catch(e){toast(e.message)}}async function loadAudit(){try{logs=await api('/audit');if(page==='audit')$('auditRows').innerHTML=tableLogs()}catch(e){toast(e.message)}}async function decide(id,decision){let note=$('note-'+id)?.value.trim();if(!note)return toast('اكتب سبب القرار');if(!confirm('تأكيد القرار بعد مراجعة المستندات؟'))return;try{await api('/cases/'+encodeURIComponent(id)+'/review','POST',{decision,note},{'X-Role':'supervisor'});await refresh();render();toast('تم تسجيل القرار')}catch(e){toast(e.message)}}function dropFiles(e){e.preventDefault();e.stopPropagation();files=Array.from(e.dataTransfer.files);render()}$('fileinput').addEventListener('change',e=>{files=Array.from(e.target.files);render()});$('folderinput').addEventListener('change',e=>{files=Array.from(e.target.files).filter(f=>/\.(pdf|png|jpe?g|xlsx)$/i.test(f.name));render();toast('تم اختيار '+files.length+' مستند من المجلد')});async function submit(){let kind=$('kind').value,client=$('client').value.trim(),notes=$('notes').value;if(!client||!files.length)return toast('أدخل مرجع العميل واختر مستندًا');if(!connected)return toast('اتصل بالخادم من الإعدادات أولًا');if(files.some(f=>f.size>10*1024*1024))return toast('ملف أكبر من 10 MB');let groups=new Map();for(let f of files){let path=f.webkitRelativePath||'',parts=path.split('/').filter(Boolean);let group=parts.length>2?parts[1]:'معاملة واحدة';if(!groups.has(group))groups.set(group,[]);groups.get(group).push(f)}if(groups.size>1&&!confirm('سيتم إنشاء '+groups.size+' معاملات منفصلة. هل تريد المتابعة؟'))return;busy=true;$('submit').disabled=true;$('submit').textContent='جاري إرسال الملفات...';let success=0,errors=[];try{for(let [group,docs] of groups){try{let c=await api('/cases','POST',{kind,client,notes:notes+(groups.size>1?' | مجلد: '+group:'')});currentId=c.id;for(let f of docs)await api('/cases/'+encodeURIComponent(c.id)+'/documents','POST',f,{'X-Filename':f.name});let r=await api('/cases/'+encodeURIComponent(c.id)+'/submit','POST',{});success++;if(r.warning)errors.push(group+': '+r.warning)}catch(e){errors.push(group+': '+e.message)}}files=[];await refresh();go('cases');toast('تم إنشاء '+success+' معاملات. '+(errors.length?'تنبيهات: '+errors.join('؛ '):''));startPolling()}finally{busy=false;if(page==='home')render()}}function startPolling(){clearInterval(poller);let count=0;poller=setInterval(async()=>{if(!connected||count++>120){clearInterval(poller);return}try{await refresh();if(page==='home')$('analysisStatus').innerHTML=analysisStatus();let c=cases.find(x=>x.id===currentId);if(c&&!['queued','processing'].includes(c.status)){clearInterval(poller);toast('وصل تحديث جديد للمعاملة');render()}}catch{}},5000)}document.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse'&&!matchMedia('(prefers-reduced-motion: reduce)').matches){let d=document.createElement( </script><!-- insurance-integration-extension --><script>

  if(currentId!==id||page!=='results')return;
  if($('detail'))$('detail').innerHTML=renderDetail(c);
  let evidence=[];try{evidence=await api('/cases/'+encodeURIComponent(id)+'/evidence')}catch{}

   const e=evidence.find(x=>x.document_id===d.id);
   return `<section style="margin-bottom:18px"><strong>${esc(d.original_name)}</strong><p><button class="ghost" onclick="downloadEvidence('${esc(d.id)}','${esc(d.id)}')">تحميل المستند الأصلي</button></p><small>${esc(e?.method||'لم يعالج بعد')} · ${esc(e?.status||'pending')}</small>${(e?.uncertainties||[]).map(u=>`<div class="notice">${esc(u)}</div>`).join('')}${(e?.pages||[]).map(p=>`<details><summary>نص المصدر · الصفحة ${esc(p.page)}</summary><pre dir="auto" style="white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px">${esc(p.text)}</pre></details>`).join('')}</section>`;

 }catch(e){toast(e.message)}

async function downloadEvidence(id,name){

  const r=await fetch('/api/documents/'+encodeURIComponent(id),{headers:{Authorization:'Bearer '+token}});
  if(!r.ok)throw Error('تعذر تحميل المستند');
  const url=URL.createObjectURL(await r.blob()),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);
 }catch(e){toast(e.message)}
}

api=async function(path,method='GET',body=null,headers={}){
 const h={...headers};delete h.Authorization;delete h['X-Role'];
 if(method!=='GET')h['X-CSRF-Token']=accountSession?.csrf||'';
 let raw=body;if(body&&!(body instanceof Blob)){h['Content-Type']='application/json';raw=JSON.stringify(body)}
 const response=await fetch('/api'+path,{method,headers:h,body:raw,credentials:'same-origin'});const data=await response.json();
 if(response.status===401){showAccountEntry('انتهت الجلسة. سجّل الدخول من جديد.');throw Error('انتهت جلسة الدخول')}
 if(!response.ok)throw Error(data.error||'تعذر إتمام الطلب');return data;
};

function findingInfo(raw){

 const diagnostic=(raw?.code||'')+' '+text;
 if(raw?.code==='REPAIR_ITEM_REQUIRES_VERIFICATION'||text==='REPAIR_ITEM_REQUIRES_VERIFICATION')return {key:'repair',title:'بند إصلاح يحتاج مقارنة بالأدلة',detail:'المبلغ والعملة يظهران في الاقتباس المرتبط أدناه. وجود البند لا يثبت علاقته بالحادث أو استحقاقه.',sources:raw?.sources||[],pattern:/hood|غطاء/i};

 if(/HOOD_REPAIR|hood|غطاء المحرك/i.test(diagnostic))return {key:'hood',title:'إصلاح غطاء المحرك يحتاج تحققًا',detail:(/850/.test(diagnostic)?'ورد تنبيه بشأن مبلغ 850 دينارًا لإصلاح الغطاء. ':'ورد تنبيه بشأن إصلاح غطاء المحرك. ')+'قارن الفاتورة مع تقرير الحادث والفحص؛ هذا تنبيه أولي وليس قرارًا باستحقاق المبلغ.',pattern:/hood|غطاء|850/i};

 if(/UNVERIFIED_POLICY_SOURCE|Policy source has not been verified/i.test(diagnostic))return {key:'policy-source',title:'مصدر الوثيقة لم يُوثّق بعد',detail:'الوثيقة المرفوعة لا تمنح توثيقًا تلقائيًا لمصدر السياسة. يلزم التحقق من السجل المعتمد.',field:'policy_number'};
 if(/POLICY_STATUS_REQUIRES_REVIEW|not confirmed as ACTIVE/i.test(diagnostic))return {key:'policy-status',title:'حالة الوثيقة تحتاج تأكيدًا',detail:'لم يؤكد التحقق أن حالة الوثيقة فعّالة. راجع الحالة من مصدرها المعتمد.',field:'policy_number'};
 if(/CONFLICTING_POLICY_NUMBERS/.test(diagnostic))return {key:'policy-conflict',title:'رقم الوثيقة لا يتطابق بين البيانات والمستندات',detail:'قارن رقم الوثيقة المدخل مع الأرقام الظاهرة في المصادر؛ لم تُعدّل البيانات تلقائيًا.',pattern:/POL-[A-Z0-9-]+/i,field:'policy_number'};
 if(/OCR_LOW_CONFIDENCE|OCR_PAGE_LIMIT/.test(diagnostic))return {key:text,title:'قراءة المستند تحتاج تدقيقًا',detail:'قد تكون قراءة بعض الحروف أو الأرقام غير دقيقة، أو تجاوز المستند حد المعالجة. قارن النص بالصفحة الأصلية قبل الاعتماد.'};

function collectFindings(result){
 const seen=new Set();return [...(result.findings||[]),...(result.flags||[])].sort((a,b)=>Number(typeof b==='object')-Number(typeof a==='object')).map(raw=>({...findingInfo(raw),severity:raw?.severity||null})).filter(f=>{if(seen.has(f.key))return false;seen.add(f.key);return true});
}
function relatedSources(finding,evidence){
 if(finding.sources?.length)return finding.sources.filter(s=>evidence.some(d=>d.document_id===s.document_id&&(d.pages||[]).some(p=>String(p.page)===String(s.page)&&p.text.includes(s.quote)))).map(s=>({document_id:s.document_id,page:s.page,text:s.quote}));
 if(!finding.pattern)return [];
 const matches=[];
 for(const doc of evidence)for(const page of doc.pages||[]){
  const lines=String(page.text||'').split('\n');const indices=lines.map((line,index)=>finding.pattern.test(line)?index:-1).filter(i=>i>=0);
  if(indices.length){const selected=new Set();for(const i of indices)for(let j=Math.max(0,i-1);j<=Math.min(lines.length-1,i+1);j++)selected.add(j);
   matches.push({document_id:doc.document_id,page:page.page,text:[...selected].sort((a,b)=>a-b).map(i=>lines[i]).join('\n')});}
 }return matches;
}

renderDetail=function(c){

 const result=reviewResult(c);if(!c.result)return previousDetailRenderer(c);

function v2Text(value){let text=String(value??'');for(const [key,label] of Object.entries(fieldLabels))text=text.replaceAll(key,label);return text}

loadDetail=async function(id){

async function loadV2Report(id,request=v2Request){
 try{
  const data=await api('/cases/'+encodeURIComponent(id)+'/report');
  if(request!==v2Request||currentId!==id||page!=='results'||!$('v2-report'))return;
  v2State=data;renderV2Report();
  const pending=data.status!=='completed';document.querySelectorAll('#review-resolution button').forEach(b=>b.disabled=pending||!data.is_current);
  if(pending)v2Timer=setTimeout(()=>loadV2Report(id,request),2500);
 }catch(e){if(request===v2Request&&$('v2-report'))$('v2-report').innerHTML=`<div class="v2-warning">تعذر تحميل التقرير: ${esc(e.message)} <button onclick="loadV2Report(currentId)">إعادة المحاولة</button></div>`}
}
function renderV2Report(){

 }
 const tabs=[['overview','الملخص'],['findings','الملاحظات'],['comparison','مقارنة الأدلة'],['coverage','القراءة والتصنيف'],['tasks','الاستكمال'],['history','التدقيق والإصدارات']];
 if(!tabs.some(t=>t[0]===v2Tab))v2Tab='overview';
 target.innerHTML=`<header class="v2-report-header"><div><span class="v2-kicker">تقرير مراجعة · الإصدار ${esc(s.version)}</span><h2>${r.quality_state==='PARTIAL'?'تقرير أولي مع حدود واضحة':'جاهز لمراجعتك'}</h2><p>${esc(r.decision_notice)}</p></div><a class="ghost" href="/api/cases/${encodeURIComponent(s.case_id)}/report-print?version=${encodeURIComponent(s.version)}" target="_blank" rel="noopener">طباعة / حفظ PDF ↗</a></header>${s.is_current===false?'<div class="v2-warning">إصدار سابق للقراءة فقط. <button onclick="loadV2Report(currentId)">العودة للإصدار الحالي</button></div>':''}${s.role_changes_pending?'<div class="v2-warning">تغيّر تصنيف مستند أو أُضيف مستند بعد هذا التقرير. أعد التحليل بإصدار جديد لتحديث النتيجة.</div>':''}<nav class="v2-tabs" aria-label="أقسام التقرير">${tabs.map(([key,label])=>`<button type="button" aria-current="${v2Tab===key?'page':'false'}" onclick="v2ChooseTab('${key}')">${label}${key==='tasks'?` <small>${s.tasks.filter(t=>['OPEN','IN_PROGRESS'].includes(t.state)).length}</small>`:''}</button>`).join('')}</nav><section class="v2-section" id="v2-section" tabindex="-1">${({overview:v2Overview,findings:v2Findings,comparison:v2Comparison,coverage:v2Coverage,tasks:v2Tasks,history:v2History}[v2Tab])()}</section>`;

function v2Coverage(){const r=v2State.report;return `<p>تصنيف المستند المقترح قابل للتصحيح. تغيير التصنيف يحتاج إعادة تحليل حتى لا يتغيّر تقرير محفوظ بصمت.</p>${r.coverage.documents.map(d=>{const doc=r.documents.find(x=>x.id===d.document_id);return `<article class="v2-document"><h3 dir="auto">${esc(d.name)}</h3><p>${d.complete?'قراءة مكتملة ضمن حدود المعالجة':'قراءة جزئية أو غير مؤكدة'} · الصفحات المعروفة: ${esc(d.expected_pages??'غير معروف')}</p><div class="v2-page-status">${d.pages.map(p=>`<span>${esc(p.page)}: ${esc(v2Names[p.status])}</span>`).join('')||'<span>لم يتوفر نص</span>'}</div><details><summary>تصنيف المستند · ${esc(v2Roles[doc?.role]||'غير مصنّف')} · ${doc?.role_origin==='REVIEWER'?'حدّده المراجع':'اقتراح آلي'}</summary><form onsubmit="v2SaveRole(event,'${esc(d.document_id)}')"><label class="field">الدور<select name="role">${Object.entries(v2Roles).map(([key,label])=>`<option value="${key}" ${doc?.role===key?'selected':''}>${label}</option>`).join('')}</select></label><label class="field">سبب التغيير<input name="note" required maxlength="2000"></label><button class="ghost" type="submit">حفظ التصنيف</button></form></details></article>`}).join('')}`}
function v2Tasks(){return `<p>إغلاق المهمة إجراء موثّق من المراجع، ولا يغيّر المستند أو يعالج نقصه تلقائيًا. بعد إرفاق مستند أعد التحليل لتحديث المقارنة.</p>${v2State.tasks.map(t=>`<article class="v2-task"><div class="v2-section-title"><h3>${esc(t.title)}</h3><span>${esc(v2Names[t.state])}</span></div><p>${esc(v2Text(t.reason))}</p>${v2SourceButtons(t.evidence_ids)}<details><summary>تعيين المسؤول وتحديث المتابعة</summary><form onsubmit="v2SaveTask(event,'${esc(t.id)}')"><div class="v2-form-grid"><label class="field">المسؤول<input name="owner" maxlength="100" value="${esc(t.owner)}"></label><label class="field">موعد المتابعة<input name="due_date" type="date" value="${esc(t.due_date)}"></label><label class="field">الحالة<select name="state">${['OPEN','IN_PROGRESS','CLOSED','WAIVED'].map(k=>`<option value="${k}" ${t.state===k?'selected':''}>${v2Names[k]}</option>`).join('')}</select></label><label class="field">سبب الإجراء<input name="note" required maxlength="2000" value="${esc(t.note)}"></label></div><button class="ghost" type="submit">حفظ المتابعة</button></form></details></article>`).join('')||'<p class="v2-empty">لا توجد مهام استكمال مولّدة لهذا الإصدار.</p>'}<form class="v2-upload" onsubmit="v2Supplement(event)"><h3>إرفاق مستند استكمال</h3><label class="field">الملف<input name="file" type="file" accept=".pdf,.png,.jpg,.jpeg,.xlsx" required></label><button class="ghost" type="submit">حفظ المستند</button><p class="muted">يحفظ الأصل، ثم تحتاج إعادة التحليل من نموذج تصحيح الإصدار أسفل التقرير.</p></form>`}
function v2History(){const r=v2State.report;return `<h3>تتبّع هذا التقرير</h3><dl class="v2-audit"><dt>الإصدار</dt><dd>${esc(v2State.version)}</dd><dt>وقت الإنشاء</dt><dd>${esc(v2Time(r.generated_at))}</dd><dt>قواعد التقرير</dt><dd dir="ltr">${esc(r.schema_version)}</dd><dt>نموذج التحليل والتدقيق</dt><dd dir="ltr">${esc(r.model_name)}</dd><dt>حالة مراجعة النموذج</dt><dd>${esc(v2Names[r.model_status]||r.model_status)}</dd><dt>تنفيذ n8n للتقرير</dt><dd>${esc(r.execution_id||'لم يكتمل')}</dd></dl><p class="muted">استدعاءان منفصلان للنموذج نفسه. قد يشتركان في الخطأ؛ مراجعة النموذج لا تثبت أصالة المستند.</p>${v2State.error?`<div class="v2-warning">لم يكتمل المسار اللغوي. التقرير الحالي يوضح حدود الفحوص المتاحة.<form onsubmit="v2RetryReport(event)"><label class="field">سبب إعادة المحاولة<input name="note" required></label><button class="ghost">إعادة محاولة تدقيق التقرير</button></form></div>`:''}<h3>ما تغير بين الإصدارات؟</h3><div id="v2-changes"><p class="muted">${v2State.history.length>1?'راجع سجل الإصدارات في عارض الأدلة؛ محفوظ دون استبدال الأصول.':'هذا أول تقرير لهذه المعاملة.'}</p></div><ul>${v2State.history.map(h=>`<li>الإصدار ${esc(h.version)} · ${esc(v2Time(h.updated_at))}</li>`).join('')}</ul>`}
async function v2Write(action,data){try{await api('/cases/'+encodeURIComponent(currentId)+'/'+action,'POST',{version:v2State.version,...data});await loadV2Report(currentId);toast('حُفظ الإجراء في سجل المعاملة')}catch(e){toast(e.message)}}
const v2HistoryBase=v2History;
v2History=function(){
 const s=v2State,c=s.changes;
 return v2HistoryBase()+`<section class="v2-history-diff"><h3>الفروق عن الإصدار السابق</h3><p class="muted">قد يتغيّر تجميع الملاحظات أو القواعد؛ اختفاء ملاحظة مستقلة لا يثبت زوال سببها.</p>${c?`<p>المقارنة مع الإصدار ${esc(c.previous_version)} · الصفحات المقروءة: ${esc(c.previous_read_pages)} ← ${esc(c.read_pages)}</p>${c.fields.map(f=>`<p><strong>${esc(fieldLabels[f.field]||f.field)}</strong><br><del dir="auto">${esc(f.before??'غير متوفر')}</del> ← <ins dir="auto">${esc(f.after??'غير متوفر')}</ins></p>`).join('')}${c.findings_added.map(t=>`<p>أُضيفت ملاحظة: ${esc(t)}</p>`).join('')}${c.findings_removed.map(t=>`<p>لم تعد معروضة كملاحظة مستقلة: ${esc(t)}</p>`).join('')}${!c.fields.length&&!c.findings_added.length&&!c.findings_removed.length?'<p>لم تتغير الحقول أو ملاحظات القواعد.</p>':''}`:'<p>لا يوجد تقرير سابق للمقارنة.</p>'}<div class="v2-history-actions">${s.history.map(h=>`<button class="ghost" onclick="v2OpenVersion(${Number(h.version)})">فتح الإصدار ${esc(h.version)}</button>`).join('')}</div></section>`;
};
async function v2OpenVersion(version){const request=++v2Request;clearTimeout(v2Timer);try{const id=currentId;const data=await api('/cases/'+encodeURIComponent(id)+'/report?version='+encodeURIComponent(version));if(currentId!==id||request!==v2Request)return;v2State=data;v2Tab='history';renderV2Report();document.querySelectorAll('#review-resolution button').forEach(b=>b.disabled=!data.is_current)}catch(e){toast(e.message)}}
async function v2SaveTask(event,id){event.preventDefault();const task=v2State.tasks.find(t=>t.id===id),f=new FormData(event.currentTarget);await v2Write('followup',{task_id:id,revision:task.revision,...Object.fromEntries(f)})}
async function v2SaveRole(event,id){event.preventDefault();await v2Write('document-role',{document_id:id,...Object.fromEntries(new FormData(event.currentTarget))})}
async function v2RetryReport(event){event.preventDefault();await v2Write('report-retry',Object.fromEntries(new FormData(event.currentTarget)))}
async function v2Supplement(event){event.preventDefault();const f=new FormData(event.currentTarget).get('file');if(!f?.size)return;const button=event.currentTarget.querySelector('button');button.disabled=true;try{const res=await fetch('/api/cases/'+encodeURIComponent(currentId)+'/supplements',{method:'POST',credentials:'same-origin',headers:{'X-CSRF-Token':accountSession.csrf,'X-Filename':encodeURIComponent(f.name),'X-Claim-Version':String(v2State.version)},body:f});const data=await res.json();if(!res.ok)throw Error(data.error);v2State.role_changes_pending=true;renderV2Report();toast('حُفظ المستند. أعد التحليل بإصدار جديد لتحديث التقرير.')}catch(e){toast(e.message)}finally{button.disabled=false}}
function openV2Source(id,group=''){
 const source=v2State?.report?.sources[id],s=evidenceReview;if(!source||!s)return;
 const index=s.documents.findIndex(d=>d.id===source.document_id);if(index<0)return;
 const doc=s.evidence.find(d=>d.document_id===source.document_id),pi=(doc?.pages||[]).findIndex(p=>String(p.page)===String(source.page));
 if(pi<0){toast('المصدر غير متاح في الإصدار المعروض');return}
 v2ActiveSource=id;selectEvidence(index,'text',pi);
 const pre=document.querySelector('#evidence-reader .source-text'),text=doc.pages[pi].text,pos=text.indexOf(source.quote);
 if(pre&&pos>=0)pre.innerHTML=esc(text.slice(0,pos))+'<mark tabindex="-1">'+esc(source.quote)+'</mark>'+esc(text.slice(pos+source.quote.length));
 const choices=group.split(',').filter(e=>v2State.report.sources[e]);
 const reader=$('evidence-reader');reader?.insertAdjacentHTML('afterbegin',`<div class="v2-source-context"><strong>الدليل المحدد</strong>${choices.length>1?`<label class="field">مقاطع الدليل<select onchange="openV2Source(this.value,'${esc(group)}')">${choices.map((e,i)=>`<option value="${esc(e)}" ${e===id?'selected':''}>${i+1}. ${esc(v2State.report.sources[e].quote.slice(0,70))}</option>`).join('')}</select></label>`:''}<blockquote dir="auto">${esc(source.quote)}</blockquote><button class="ghost" onclick="v2CompareSource()">مقارنته بمصدر آخر</button></div>`);
 $('evidence-panel').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'nearest'});pre?.querySelector('mark')?.focus({preventScroll:true});
}
function v2CompareSource(){
 const first=v2State.report.sources[v2ActiveSource];if(!first)return;
 const related=new Set(v2State.report.findings.filter(f=>(f.evidence_ids||[]).includes(v2ActiveSource)).flatMap(f=>f.evidence_ids||[]));
 const available=Object.values(v2State.report.sources).filter(s=>s.document_id!==first.document_id&&s.readable);
 const preferred=available.filter(s=>related.has(s.evidence_id)),sources=preferred.length?preferred:available.slice(0,20);
 const panel=$('v2-comparison-pane');panel?.remove();
 $('v2-section').insertAdjacentHTML('afterbegin',`<section id="v2-comparison-pane" class="v2-compare-pane"><div><h3>المصدر الأول</h3><p>${esc(first.document_name)} · ${esc(first.page)}</p><blockquote dir="auto">${esc(first.quote)}</blockquote></div><div><label class="field">المصدر المقابل<select onchange="v2CompareQuote(this.value)"><option value="">اختر مقطعًا من مستند آخر</option>${sources.map(s=>`<option value="${esc(s.evidence_id)}">${esc(s.document_name)} · ${esc(s.page)} · ${esc(s.quote.slice(0,65))}</option>`).join('')}</select></label><blockquote id="v2-second-quote" dir="auto"></blockquote></div><button class="ghost" onclick="document.getElementById('v2-comparison-pane').remove()">إغلاق المقارنة</button></section>`);
 $('v2-comparison-pane').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function v2CompareQuote(id){const source=v2State.report.sources[id];$('v2-second-quote').textContent=source?.quote||''}
// Clearly identify the independent edition even on the account screen.
document.title='IntelliSure V2 · مراجعة الأدلة';
const v2ShowAccount=showAccountEntry;showAccountEntry=function(message=''){v2ShowAccount(message);const p=document.querySelector('#account-entry .muted');if(p)p.textContent='IntelliSure V2 · نسخة مستقلة لمراجعة الأدلة'};

</script></body></html>

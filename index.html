async function authRequest(path,obj){const res=await fetch('/api/auth/'+path,{method:obj===undefined?'GET':'POST',credentials:'same-origin',headers:obj===undefined?{}:{'Content-Type':'application/json',...(accountSession?{'X-CSRF-Token':accountSession.csrf}:{})},body:obj===undefined?undefined:JSON.stringify(obj)});const data=await res.json();if(!res.ok)throw Error(authErrors[data.error]||data.error||'تعذر الاتصال');return data}

function auditLabel(value){return {created:'إنشاء المعاملة',uploaded:'إرفاق مستند',result_received:'استلام نتيجة التحليل',corrected:'تصحيح أو تحديث إصدار',reviewed:'تسجيل مراجعة',review_synced:'مزامنة المراجعة',v2_report_published:'نشر تقرير مدقّق',followup_changed:'تحديث مهمة استكمال',document_role_changed:'تغيير تصنيف مستند',supplement_uploaded:'إرفاق مستند استكمال'}[value]||value}
function auditPage(){return '<header class="page-head"><div><a class="back-link" href="#/cases">← المعاملات</a><h1>سجل النشاط</h1></div></header><section id="audit-content" class="audit-panel">جارٍ تحميل السجل…</section>'}
async function loadWorkspaceAudit(){try{const data=await api('/audit');if(route.type!=='audit')return;$('audit-content').innerHTML=data.map(a=>`<article class="audit-event"><strong>${esc(auditLabel(a.action))}</strong><small>${esc(a.actor)} · ${esc(v2Time(a.created_at))}</small>${a.case_id?`<button class="text-button" onclick="openCase('${esc(a.case_id)}','history')">${esc(a.case_id)}</button>`:''}</article>`).join('')||'<p>لا توجد أحداث بعد.</p>'}catch(e){if($('audit-content'))$('audit-content').textContent=userError(e)}}
document.addEventListener('input',rememberForm);document.addEventListener('change',rememberForm);
